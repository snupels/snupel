name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: snupel
  APP_DIR: /home/ubuntu/snupel
  APP_PORT: "3000"
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Migrate database
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
        run: npm run db:migrate

      - name: Package standalone server
        run: |
          mkdir -p .next/standalone/.next
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf "${APP_NAME}-${GITHUB_SHA}.tar.gz" -C .next/standalone .

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "$EC2_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_USER"
          scp -i ~/.ssh/ec2_key -P "$EC2_PORT" "${APP_NAME}-${GITHUB_SHA}.tar.gz" "$EC2_USER@$EC2_HOST:/tmp/${APP_NAME}-${GITHUB_SHA}.tar.gz"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "APP_NAME='$APP_NAME' APP_DIR='$APP_DIR' APP_PORT='$APP_PORT' RELEASE_ID='$GITHUB_SHA' ARCHIVE_PATH='/tmp/${APP_NAME}-${GITHUB_SHA}.tar.gz' bash -s" \
            < scripts/deploy-ec2.sh
