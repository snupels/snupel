name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-northeast-2
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  SITE_DOMAIN: sportspassport.kr

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static site
        env:
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
          NEXT_PUBLIC_SERVICE_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_SERVICE_OPERATOR_NAME }}
          NEXT_PUBLIC_SERVICE_OPERATOR_ADDRESS: ${{ vars.NEXT_PUBLIC_SERVICE_OPERATOR_ADDRESS }}
          NEXT_PUBLIC_PRIVACY_OFFICER: ${{ vars.NEXT_PUBLIC_PRIVACY_OFFICER }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront distribution before upload
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DISTRIBUTION_ID="$CLOUDFRONT_DISTRIBUTION_ID"
          if test -z "$DISTRIBUTION_ID"; then
            BUCKET_POLICY="$(aws s3api get-bucket-policy \
              --bucket "$S3_BUCKET" \
              --query Policy \
              --output text 2>/dev/null || true)"
            DISTRIBUTION_ID="$(printf '%s' "$BUCKET_POLICY" \
              | grep -oE 'distribution/[A-Z0-9]+' \
              | head -n 1 \
              | cut -d/ -f2 || true)"
          fi
          if test -z "$DISTRIBUTION_ID"; then
            DISTRIBUTION_ID="$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Aliases.Items, '$SITE_DOMAIN')].Id | [0]" \
              --output text 2>/dev/null || true)"
          fi
          if test -z "$DISTRIBUTION_ID" || test "$DISTRIBUTION_ID" = "None"; then
            echo "::error::Set CLOUDFRONT_DISTRIBUTION_ID before deploying."
            exit 1
          fi
          aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.Id' --output text
          echo "CLOUDFRONT_DISTRIBUTION_ID=$DISTRIBUTION_ID" >> "$GITHUB_ENV"

      - name: Back up current site before upload
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET"
          mkdir -p "$RUNNER_TEMP/previous-site"
          aws s3 sync "s3://$S3_BUCKET" "$RUNNER_TEMP/previous-site" --only-show-errors
          test -s "$RUNNER_TEMP/previous-site/index.html"
          tar -czf "$RUNNER_TEMP/previous-site.tar.gz" -C "$RUNNER_TEMP/previous-site" .

      - name: Preserve rollback artifact
        uses: actions/upload-artifact@v7
        with:
          name: previous-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/previous-site.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET"
          aws s3 sync out/_next/static "s3://$S3_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$S3_BUCKET" \
            --exclude "_next/static/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Refresh CloudFront cache
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
