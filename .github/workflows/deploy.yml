name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-northeast-2
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  SITE_DOMAIN: sportspassport.kr

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Restore assets referenced by cached HTML
        run: |
          PAGE_JS=""
          for candidate in \
            out/_next/static/chunks/0uz0zug29dmzc.js \
            out/_next/static/chunks/0qd22w6efhkya.js
          do
            if test -f "$candidate"; then
              PAGE_JS="$candidate"
              break
            fi
          done
          if test -n "$PAGE_JS"; then
            cp "$PAGE_JS" out/_next/static/chunks/1j59scfz7d6eu.js
            cp "$PAGE_JS" out/_next/static/chunks/355a4lrjr9zbf.js
          fi
          CSS_FILE="$(find out/_next/static/chunks -maxdepth 1 -name '*.css' -print -quit)"
          if test -n "$CSS_FILE"; then
            cp "$CSS_FILE" out/_next/static/chunks/2li9a_fbp66pi.css
            cp "$CSS_FILE" out/_next/static/chunks/14z98_idkgd34.css
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET"
          aws s3 sync out/_next/static "s3://$S3_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$S3_BUCKET" \
            --exclude "_next/static/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Refresh CloudFront cache
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DISTRIBUTION_ID="$CLOUDFRONT_DISTRIBUTION_ID"
          if test -z "$DISTRIBUTION_ID"; then
            BUCKET_POLICY="$(aws s3api get-bucket-policy \
              --bucket "$S3_BUCKET" \
              --query Policy \
              --output text 2>/dev/null || true)"
            DISTRIBUTION_ID="$(printf '%s' "$BUCKET_POLICY" \
              | grep -oE 'distribution/[A-Z0-9]+' \
              | head -n 1 \
              | cut -d/ -f2 || true)"
          fi
          if test -z "$DISTRIBUTION_ID"; then
            DISTRIBUTION_ID="$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Aliases.Items, '$SITE_DOMAIN')].Id | [0]" \
              --output text 2>/dev/null || true)"
          fi
          if test -z "$DISTRIBUTION_ID" || test "$DISTRIBUTION_ID" = "None"; then
            echo "::warning::CloudFront distribution could not be discovered; cache invalidation skipped."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
