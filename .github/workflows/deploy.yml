name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-northeast-2
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Restore assets referenced by cached HTML
        run: |
          if test -f out/_next/static/chunks/0qd22w6efhkya.js; then
            cp out/_next/static/chunks/0qd22w6efhkya.js \
              out/_next/static/chunks/1j59scfz7d6eu.js
          fi
          CSS_FILE="$(find out/_next/static/chunks -maxdepth 1 -name '*.css' -print -quit)"
          if test -n "$CSS_FILE"; then
            cp "$CSS_FILE" out/_next/static/chunks/2li9a_fbp66pi.css
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET"
          aws s3 sync out/_next/static "s3://$S3_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$S3_BUCKET" \
            --exclude "_next/static/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Refresh CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
