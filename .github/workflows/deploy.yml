name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET"
          aws s3 sync out/_next/static "s3://$S3_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$S3_BUCKET" \
            --exclude "_next/static/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Refresh CloudFront cache
        run: |
          DISTRIBUTION_ID="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Quantity > \`0\` && contains(Aliases.Items, 'sportspassport.kr')].Id | [0]" \
            --output text)"
          test -n "$DISTRIBUTION_ID"
          test "$DISTRIBUTION_ID" != "None"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
